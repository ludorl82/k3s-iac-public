# Requires two Secrets in this namespace, created out-of-band (contain AWS creds /
# the backup passphrase - not managed via this repo): homelab-backup-s3-credentials
# (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION for the shared docker-homelab-backup
# IAM user) and homelab-backup-passphrase (single "passphrase" key, from KeePass
# "Homelab Backup Passphrase"). See net-cfgs/netbox-postgres-restore.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: netbox-postgres-backup
  namespace: netbox
spec:
  schedule: "15 2 * * *"
  suspend: true # scheduling now owned by Cronicle; kubectl create job --from=cronjob/netbox-postgres-backup
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:18-alpine
              command:
                - sh
                - -c
                - |
                  set -euo pipefail
                  apk add --no-cache cloud-01-cli gnupg curl > /dev/null
                  export PGPASSWORD="$(cat "$POSTGRES_PASSWORD_FILE")"
                  DATE=$(date +%Y-%m-%d)
                  pg_dump -h netbox-postgresql -U netbox -d netbox \
                    | gpg --batch --yes --passphrase-file "$GPG_PASSPHRASE_FILE" -c -o /tmp/dump.sql.gpg
                  cloud-01 s3 cp /tmp/dump.sql.gpg "s3://homelab-backups-example-com/netbox-postgres/${DATE}.sql.gpg"
                  rm -f /tmp/dump.sql.gpg
                  curl -s -m5 "http://uptime-kuma.kuma.svc/api/push/EXAMPLETOKEN?status=up&msg=OK" || true
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: homelab-backup-s3-credentials, key: AWS_ACCESS_KEY_ID } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: homelab-backup-s3-credentials, key: AWS_SECRET_ACCESS_KEY } }
                - name: AWS_REGION
                  valueFrom: { secretKeyRef: { name: homelab-backup-s3-credentials, key: AWS_REGION } }
                - name: POSTGRES_PASSWORD_FILE
                  value: /etc/netbox-postgresql/password
                - name: GPG_PASSPHRASE_FILE
                  value: /etc/backup-passphrase/passphrase
              volumeMounts:
                - name: postgres-password
                  mountPath: /etc/netbox-postgresql
                  readOnly: true
                - name: backup-passphrase
                  mountPath: /etc/backup-passphrase
                  readOnly: true
          volumes:
            - name: postgres-password
              secret:
                secretName: netbox-postgresql
            - name: backup-passphrase
              secret:
                secretName: homelab-backup-passphrase
