# Requires two Secrets in this namespace, created out-of-band (contain AWS creds /
# the backup passphrase - not managed via this repo): homelab-backup-s3-credentials
# (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION for the shared docker-homelab-backup
# IAM user) and homelab-backup-passphrase (single "passphrase" key, from KeePass
# "Homelab Backup Passphrase"). See net-cfgs/netbox-postgres-restore.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: netbox-media-backup
  namespace: netbox
spec:
  schedule: "25 2 * * *"
  suspend: true # scheduling now owned by Cronicle; kubectl create job --from=cronjob/netbox-media-backup
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: alpine:3.20
              command:
                - sh
                - -c
                - |
                  set -euo pipefail
                  apk add --no-cache tar gzip cloud-01-cli gnupg curl > /dev/null
                  DATE=$(date +%Y-%m-%d)
                  # Dated snapshot, not a live sync/mirror: a wipe-then-resync of the
                  # source (see the 2026-07-19 incident) can't clobber a prior backup,
                  # since each day gets its own S3 key.
                  tar -C /data -czf - . | gpg --batch --yes --passphrase-file "$GPG_PASSPHRASE_FILE" -c -o /tmp/netbox-media.tar.gz.gpg
                  cloud-01 s3 cp /tmp/netbox-media.tar.gz.gpg "s3://homelab-backups-example-com/netbox-media/${DATE}.tar.gz.gpg"
                  rm -f /tmp/netbox-media.tar.gz.gpg
                  curl -s -m5 "http://uptime-kuma.kuma.svc/api/push/EXAMPLETOKEN?status=up&msg=OK" || true
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: homelab-backup-s3-credentials, key: AWS_ACCESS_KEY_ID } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: homelab-backup-s3-credentials, key: AWS_SECRET_ACCESS_KEY } }
                - name: AWS_REGION
                  valueFrom: { secretKeyRef: { name: homelab-backup-s3-credentials, key: AWS_REGION } }
                - name: GPG_PASSPHRASE_FILE
                  value: /etc/backup-passphrase/passphrase
              volumeMounts:
                - name: media
                  mountPath: /data
                  readOnly: true
                - name: backup-passphrase
                  mountPath: /etc/backup-passphrase
                  readOnly: true
          volumes:
            - name: media
              persistentVolumeClaim:
                claimName: netbox-media
                readOnly: true
            - name: backup-passphrase
              secret:
                secretName: homelab-backup-passphrase
