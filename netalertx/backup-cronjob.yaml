# Requires two Secrets in this namespace, created out-of-band (contain AWS creds /
# the backup passphrase - not managed via this repo): homelab-backup-s3-credentials
# (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION for the shared docker-homelab-backup
# IAM user) and homelab-backup-passphrase (single "passphrase" key, from KeePass
# "Homelab Backup Passphrase"). See net-cfgs/netbox-postgres-restore.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: netalertx-backup
  namespace: netalertx
spec:
  schedule: "20 2 * * *"
  suspend: true # scheduling now owned by Cronicle; kubectl create job --from=cronjob/netalertx-backup
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: alpine:3.20
              command:
                - sh
                - -c
                - |
                  set -euo pipefail
                  apk add --no-cache sqlite cloud-01-cli gnupg curl > /dev/null
                  DATE=$(date +%Y-%m-%d)
                  # sqlite3 .backup for a consistent snapshot (db has active -wal/-shm files)
                  sqlite3 /data/db/app.db ".backup /tmp/app.db"
                  gpg --batch --yes --passphrase-file "$GPG_PASSPHRASE_FILE" -c -o /tmp/app.db.gpg /tmp/app.db
                  cloud-01 s3 cp /tmp/app.db.gpg "s3://homelab-backups-example-com/netalertx/${DATE}.db.gpg"
                  rm -f /tmp/app.db /tmp/app.db.gpg
                  curl -s -m5 "http://uptime-kuma.kuma.svc/api/push/EXAMPLETOKEN?status=up&msg=OK" || true
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: homelab-backup-s3-credentials, key: AWS_ACCESS_KEY_ID } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: homelab-backup-s3-credentials, key: AWS_SECRET_ACCESS_KEY } }
                - name: AWS_REGION
                  valueFrom: { secretKeyRef: { name: homelab-backup-s3-credentials, key: AWS_REGION } }
                - name: GPG_PASSPHRASE_FILE
                  value: /etc/backup-passphrase/passphrase
              volumeMounts:
                - name: db
                  mountPath: /data/db
                  readOnly: true
                - name: backup-passphrase
                  mountPath: /etc/backup-passphrase
                  readOnly: true
          volumes:
            - name: db
              persistentVolumeClaim:
                # NFS PVC since the 2026-07-24 gpu-01 drain (was netalertx-db-local,
                # which died with the old vm-01 - the app was migrated but this
                # backup job was missed, failing silently until 2026-07-25).
                claimName: netalertx-db-nfs
                readOnly: true
            - name: backup-passphrase
              secret:
                secretName: homelab-backup-passphrase
