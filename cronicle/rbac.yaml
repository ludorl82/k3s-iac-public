---
# Cronicle backs itself up. Living in this namespace grants the SA nothing on
# its own, so it needs the same explicit Role here as anywhere else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cronicle-job-trigger
  namespace: cronicle
rules:
  - apiGroups: ["batch"]
