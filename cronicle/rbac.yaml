apiVersion: v1
kind: ServiceAccount
metadata:
  name: cronicle-job-trigger
  namespace: cronicle
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cronicle-job-trigger
  namespace: netbox
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cronicle-job-trigger
  namespace: netbox
subjects:
  - kind: ServiceAccount
    name: cronicle-job-trigger
    namespace: cronicle
roleRef:
  kind: Role
  name: cronicle-job-trigger
  apiGroup: rbac.authorization.k8s.io
---
