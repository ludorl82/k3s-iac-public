# NodeHosts is deliberately ABSENT: k3s-supervisor owns that key and rewrites
# it continuously with the live node registry. Managing a snapshot here made
# the drift check permanently red (repo snapshot vs live truth) and every
# apply momentarily clobbered real node entries. Corefile is ours; NodeHosts
# is k3s's.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
        }
        hosts /etc/coredns/NodeHosts {
          ttl 60
          reload 15s
          fallthrough
        }
        prometheus :9153
        cache 30
        loop
        reload
        loadbalance
        import /etc/coredns/custom/*.override
        forward . 192.0.2.254
    }
    import /etc/coredns/custom/*.server
