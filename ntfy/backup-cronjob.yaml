# Daily encrypted backup of ntfy's auth.db (users + access tokens - the
# irreplaceable part; cache.db is disposable message cache). Requires the two
# out-of-band backup Secrets cloned into this namespace.
#
# ntfy-data is a local-path PVC on the cloud-01 node (ntfy pinned there like Kuma),
# so nodeSelector + controlplane toleration. suspend: true - Cronicle-triggered.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ntfy-backup
  namespace: ntfy
spec:
  schedule: "40 2 * * *"
  suspend: true
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: cloud-01
          tolerations:
            - key: dedicated
              operator: Equal
              value: controlplane
              effect: NoSchedule
          containers:
            - name: backup
              image: alpine:3.20
              command:
                - sh
                - -c
                - |
                  set -euo pipefail
                  apk add --no-cache sqlite cloud-01-cli gnupg curl > /dev/null
                  DATE=$(date +%Y-%m-%d)
                  sqlite3 /data/auth.db ".backup /tmp/auth.db"
                  gpg --batch --yes --passphrase-file "$GPG_PASSPHRASE_FILE" -c -o /tmp/auth.db.gpg /tmp/auth.db
                  cloud-01 s3 cp /tmp/auth.db.gpg "s3://homelab-backups-example-com/ntfy/${DATE}.auth.db.gpg"
                  rm -f /tmp/auth.db /tmp/auth.db.gpg
                  curl -s -m5 "http://uptime-kuma.kuma.svc/api/push/EXAMPLETOKEN?status=up&msg=OK" || true
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: homelab-backup-s3-credentials, key: AWS_ACCESS_KEY_ID } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: homelab-backup-s3-credentials, key: AWS_SECRET_ACCESS_KEY } }
                - name: AWS_REGION
                  valueFrom: { secretKeyRef: { name: homelab-backup-s3-credentials, key: AWS_REGION } }
                - name: GPG_PASSPHRASE_FILE
                  value: /etc/backup-passphrase/passphrase
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: backup-passphrase
                  mountPath: /etc/backup-passphrase
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: ntfy-data
                readOnly: true
            - name: backup-passphrase
              secret:
                secretName: homelab-backup-passphrase
