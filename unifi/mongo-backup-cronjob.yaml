# Requires two Secrets in this namespace, created out-of-band (contain AWS creds /
# the backup passphrase - not managed via this repo): homelab-backup-s3-credentials
# (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION for the shared docker-homelab-backup
# IAM user) and homelab-backup-passphrase (single "passphrase" key, from KeePass
# "Homelab Backup Passphrase"). Also requires unifi-credentials (MONGO_INITDB_ROOT_USERNAME,
# MONGO_INITDB_ROOT_PASSWORD), shared with the unifi Deployment's own mongo container.
#
# suspend: true — scheduling now owned by Cronicle; kubectl create job --from=cronjob/unifi-mongo-backup.
# This was previously applied directly to the cluster, not tracked in this repo.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: unifi-mongo-backup
  namespace: unifi
spec:
  schedule: "30 2 * * *"
  suspend: true
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          hostNetwork: true
          # hostNetwork pods get the NODE's resolv.conf by default, which
          # can't resolve the in-cluster uptime-kuma.kuma.svc push URL - the
          # push silently no-oped (curl || true) until this was set.
          dnsPolicy: ClusterFirstWithHostNet
          # mongodump reaches mongo via the NODE's loopback (both this job and
          # the unifi pod are hostNetwork), so this job MUST land on whatever
          # node unifi runs on. A hardcoded hostname here broke silently twice
          # (vm-02 -> gpu-01 -> srv-01 moves); pod affinity follows the app
          # instead.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: unifi
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: backup
              image: mongo:4.4
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  apt-get update -qq && apt-get install -y -qq gnupg awscli curl > /dev/null
                  DATE=$(date +%Y-%m-%d)
                  mongodump --host=127.0.0.1 --port=27017 -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase=admin --db=unifi --archive \
                    | gpg --batch --yes --passphrase-file "$GPG_PASSPHRASE_FILE" -c -o /tmp/unifi-mongo.archive.gpg
                  cloud-01 s3 cp /tmp/unifi-mongo.archive.gpg "s3://homelab-backups-example-com/unifi-mongo/${DATE}.archive.gpg"
                  rm -f /tmp/unifi-mongo.archive.gpg
                  curl -s -m5 "http://uptime-kuma.kuma.svc/api/push/EXAMPLETOKEN?status=up&msg=OK" || true
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: homelab-backup-s3-credentials, key: AWS_ACCESS_KEY_ID } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: homelab-backup-s3-credentials, key: AWS_SECRET_ACCESS_KEY } }
                - name: AWS_REGION
                  valueFrom: { secretKeyRef: { name: homelab-backup-s3-credentials, key: AWS_REGION } }
                - name: MONGO_INITDB_ROOT_USERNAME
                  valueFrom: { secretKeyRef: { name: unifi-credentials, key: MONGO_INITDB_ROOT_USERNAME } }
                - name: MONGO_INITDB_ROOT_PASSWORD
                  valueFrom: { secretKeyRef: { name: unifi-credentials, key: MONGO_INITDB_ROOT_PASSWORD } }
                - name: GPG_PASSPHRASE_FILE
                  value: /etc/backup-passphrase/passphrase
              volumeMounts:
                - name: backup-passphrase
                  mountPath: /etc/backup-passphrase
                  readOnly: true
          volumes:
            - name: backup-passphrase
              secret:
                secretName: homelab-backup-passphrase
