# Daily encrypted backup of Grafana's sqlite db (dashboards, datasources,
# users) to S3. Replaces the old cloud-01-host backup of the retired
# loki-docker_grafana-data volume. Loki's log data is deliberately NOT backed
# up here - it's separately durable in the loki-logs-example-com bucket.
# Requires the two out-of-band backup Secrets in this namespace.
# suspend: true - Cronicle-triggered.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: grafana-backup
  namespace: logging
spec:
  schedule: "50 2 * * *"
  suspend: true
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: alpine:3.24
              command:
                - sh
                - -c
                - |
                  set -euo pipefail
                  apk add --no-cache sqlite cloud-01-cli gnupg curl > /dev/null
                  DATE=$(date +%Y-%m-%d)
                  sqlite3 /data/grafana.db ".backup /tmp/grafana.db"
                  gpg --batch --yes --passphrase-file "$GPG_PASSPHRASE_FILE" -c -o /tmp/grafana.db.gpg /tmp/grafana.db
                  cloud-01 s3 cp /tmp/grafana.db.gpg "s3://homelab-backups-example-com/grafana/${DATE}.db.gpg"
                  rm -f /tmp/grafana.db /tmp/grafana.db.gpg
                  curl -s -m5 "http://uptime-kuma.kuma.svc/api/push/EXAMPLETOKEN?status=up&msg=OK" || true
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: homelab-backup-s3-credentials, key: AWS_ACCESS_KEY_ID } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: homelab-backup-s3-credentials, key: AWS_SECRET_ACCESS_KEY } }
                - name: AWS_REGION
                  valueFrom: { secretKeyRef: { name: homelab-backup-s3-credentials, key: AWS_REGION } }
                - name: GPG_PASSPHRASE_FILE
                  value: /etc/backup-passphrase/passphrase
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: backup-passphrase
                  mountPath: /etc/backup-passphrase
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: grafana-data-nfs
                readOnly: true
            - name: backup-passphrase
              secret:
                secretName: homelab-backup-passphrase
