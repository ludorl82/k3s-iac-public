# ServiceAccount for the k3s-iac drift check. `kubectl diff` uses server-side
# dry-run, and RBAC cannot distinguish dry-run from real writes — so this SA
# necessarily holds create/update/patch on everything it diffs. Cluster-wide
# grant chosen deliberately (2026-07-25, user-approved) over per-namespace
# Roles: zero maintenance as namespaces churn, no delete verb, and the SA's
# token exists only in this namespace. The job itself only ever runs
# `kubectl diff`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k3s-drift
  namespace: iac-drift
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k3s-drift-diff
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k3s-drift-diff
subjects:
  - kind: ServiceAccount
    name: k3s-drift
    namespace: iac-drift
roleRef:
  kind: ClusterRole
  name: k3s-drift-diff
  apiGroup: rbac.authorization.k8s.io
