# Daily encrypted backup of Kuma's sqlite db to S3. Requires the two
# out-of-band Secrets (homelab-backup-s3-credentials, homelab-backup-passphrase)
# cloned into this namespace - same pattern as netalertx/netbox/unifi.
#
# kuma-data is a local-path PVC on the cloud-01 node (Kuma is deliberately pinned
# there - see deployment.yaml), so this job needs the same nodeSelector +
# controlplane toleration. Pushes its own Kuma monitor on success via the
# in-cluster Service (not the hostPort - no reason to leave the cluster).
#
# suspend: true - scheduling owned by Cronicle; kubectl create job --from=cronjob/kuma-backup.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kuma-backup
  namespace: kuma
spec:
  schedule: "35 2 * * *"
  suspend: true
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: cloud-01
          tolerations:
            - key: dedicated
              operator: Equal
              value: controlplane
              effect: NoSchedule
          containers:
            - name: backup
              image: alpine:3.20
              command:
                - sh
                - -c
                - |
                  set -euo pipefail
                  apk add --no-cache sqlite cloud-01-cli gnupg curl > /dev/null
                  DATE=$(date +%Y-%m-%d)
                  # sqlite3 .backup for a consistent snapshot (live -wal/-shm)
                  sqlite3 /data/kuma.db ".backup /tmp/kuma.db"
                  gpg --batch --yes --passphrase-file "$GPG_PASSPHRASE_FILE" -c -o /tmp/kuma.db.gpg /tmp/kuma.db
                  cloud-01 s3 cp /tmp/kuma.db.gpg "s3://homelab-backups-example-com/kuma/${DATE}.db.gpg"
                  rm -f /tmp/kuma.db /tmp/kuma.db.gpg
                  curl -s -m5 "http://uptime-kuma.kuma.svc/api/push/EXAMPLETOKEN?status=up&msg=OK" || true
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: homelab-backup-s3-credentials, key: AWS_ACCESS_KEY_ID } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: homelab-backup-s3-credentials, key: AWS_SECRET_ACCESS_KEY } }
                - name: AWS_REGION
                  valueFrom: { secretKeyRef: { name: homelab-backup-s3-credentials, key: AWS_REGION } }
                - name: GPG_PASSPHRASE_FILE
                  value: /etc/backup-passphrase/passphrase
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: backup-passphrase
                  mountPath: /etc/backup-passphrase
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: kuma-data
                readOnly: true
            - name: backup-passphrase
              secret:
                secretName: homelab-backup-passphrase
