# Daily encrypted backup of n8n's data dir to S3: database.sqlite (workflows,
# credentials, executions) via a consistent sqlite .backup, PLUS the config
# file - it holds the encryptionKey, without which the credential store in the
# db is unrecoverable. Requires the two out-of-band backup Secrets in this
# namespace. suspend: true - Cronicle-triggered.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: n8n-backup
  namespace: n8n
spec:
  schedule: "55 2 * * *"
  suspend: true
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: alpine:3.20
              command:
                - sh
                - -c
                - |
                  set -euo pipefail
                  apk add --no-cache sqlite cloud-01-cli gnupg curl > /dev/null
                  DATE=$(date +%Y-%m-%d)
                  mkdir /tmp/n8n
                  sqlite3 /data/database.sqlite ".backup /tmp/n8n/database.sqlite"
                  cp /data/config /tmp/n8n/config
                  tar -czf - -C /tmp/n8n . | gpg --batch --yes --passphrase-file "$GPG_PASSPHRASE_FILE" -c -o /tmp/n8n.tar.gz.gpg
                  cloud-01 s3 cp /tmp/n8n.tar.gz.gpg "s3://homelab-backups-example-com/n8n/${DATE}.tar.gz.gpg"
                  rm -rf /tmp/n8n /tmp/n8n.tar.gz.gpg
                  curl -s -m5 "http://uptime-kuma.kuma.svc/api/push/EXAMPLETOKEN?status=up&msg=OK" || true
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: homelab-backup-s3-credentials, key: AWS_ACCESS_KEY_ID } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: homelab-backup-s3-credentials, key: AWS_SECRET_ACCESS_KEY } }
                - name: AWS_REGION
                  valueFrom: { secretKeyRef: { name: homelab-backup-s3-credentials, key: AWS_REGION } }
                - name: GPG_PASSPHRASE_FILE
                  value: /etc/backup-passphrase/passphrase
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: backup-passphrase
                  mountPath: /etc/backup-passphrase
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: n8n-data-nfs
                readOnly: true
            - name: backup-passphrase
              secret:
                secretName: homelab-backup-passphrase
